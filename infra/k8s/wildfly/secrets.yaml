# =============================================================================
# Secrets: wildfly-secrets (TEMPLATE)
# =============================================================================
# Proposito: Template para crear los secrets de Wildfly con SSH.
#            Los valores deben ser codificados en base64 antes de aplicar.
#
# ATENCION: Este archivo es un TEMPLATE. NO commitees valores reales.
#            Usa SealedSecrets, External Secrets Operator (ESO), o
#            un vault provider en produccion.
#
# Generacion de secrets para desarrollo local:
#   echo -n "deploy" | base64          # ZGVwbG95
#   echo -n "MiPasswordSegura" | base64 # TWlQYXNzd29yZFNlZ3VyYQ==
#   echo -n "ssh-rsa AAAAB3..." | base64
#
# Uso:
#   1. Copia este template y completa los valores en base64
#   2. kubectl apply -f infra/k8s/wildfly/secrets.yaml
#
# Variables:
#   DEPLOY_USER            - Usuario SSH para despliegues CI/CD
#   DEPLOY_PASSWORD        - Password del usuario deploy
#   WILDFLY_SSH_PUBLIC_KEY - (Opcional) Clave publica SSH para autenticacion
#                            Si no se proporciona, se usa password-based auth
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: wildfly-secrets
  namespace: wildfly
  labels:
    app: geniahr-wildfly
    module: app-javaee
    component: wildfly-secrets
  annotations:
    description: "Secrets para Wildfly con SSH"
    # Si usas SealedSecrets, cambia el apiVersion a bitnami.com/v1alpha1
    # sealedsecrets.bitnami.com/managed: "true"
type: Opaque
data:
  # ── SSH User ──────────────────────────────────────────────────────────────
  # NOTA: Reemplaza con tus valores en base64
  # Para desarrollo: echo -n "deploy" | base64 → ZGVwbG95
  DEPLOY_USER: "ZGVwbG95"       # base64("deploy")

  # Password del usuario deploy
  # Para desarrollo: echo -n "deploy" | base64 → ZGVwbG95
  DEPLOY_PASSWORD: "ZGVwbG95"   # base64("deploy")

  # ── SSH Public Key (OPCIONAL) ─────────────────────────────────────────────
  # Si no se proporciona, el entrypoint.sh simplemente no inyecta clave
  # y la autenticacion queda basada en password.
  # Formato: ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQ...
  #
  # Ejemplo (REEMPLAZAR con tu clave real en base64):
  # WILDFLY_SSH_PUBLIC_KEY: "c3NoLXJzYSBBQUFBQjNOemFDMXljMkVBQUFBREFRQUJBQUFCQVFD..."
  WILDFLY_SSH_PUBLIC_KEY: ""    # Dejar vacio si no se usa clave publica
---
