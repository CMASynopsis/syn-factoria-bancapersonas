# =============================================================================
# ConfigMap: wildfly-config-${PROFILE}
# =============================================================================
# Template procesado con envsubst. Las variables ${VAR} se reemplazan
# desde el perfil activo (dev.env / staging.env / prod.env).
#
# Variables usadas:
#   PROFILE, WILDFLY_XMS, WILDFLY_XMX, WILDFLY_JAVA_OPTS, WILDFLY_HTTP_PORT
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: wildfly-config-${PROFILE}
  labels:
    app: geniahr-wildfly
    module: app-javaee
    component: wildfly-config
    environment: ${PROFILE}
  annotations:
    description: "Configuracion Wildfly para ${PROFILE}"
    profile: ${PROFILE}
data:
  # ── JVM Configuration ──────────────────────────────────────────────────
  WILDFLY_XMS: "${WILDFLY_XMS}"
  WILDFLY_XMX: "${WILDFLY_XMX}"
  WILDFLY_JAVA_OPTS: "${WILDFLY_JAVA_OPTS}"

  # ── Health Check ───────────────────────────────────────────────────────
  HEALTH_CHECK_URL: "http://localhost:${WILDFLY_HTTP_PORT}/"

  # ── Deployments ────────────────────────────────────────────────────────
  WILDFLY_DEPLOY_PATH: "/opt/jboss/wildfly/standalone/deployments"

  # ── Wildfly paths ──────────────────────────────────────────────────────
  WILDFLY_HOME: "/opt/jboss/wildfly"

  # ── Wildfly standalone mode ────────────────────────────────────────────
  WILDFLY_STANDALONE_MODE: "standalone"
---
